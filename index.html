<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>slide</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="slider-container">
    <div class="slider">
        <img src="/images/team1.png" class="active" alt="Slide 1">
        <img src="/images/team2.png" alt="Slide 2">
        <img src="/images/team3.png" alt="Slide 3">
    </div>
    <div class="buttons">
        <button id="prev" class="hidden">&#10094;</button>
        <button id="next">&#10095;</button>
    </div>
    <div class="dots">
        <span class="active" data-index="0"></span>
        <span data-index="1"></span>
        <span data-index="2"></span>
    </div>
</div>



<script src="main.js"></script>
</body>
</html>
