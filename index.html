<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ToDo List</title>
    <link rel="stylesheet" href="styles.css">
    <link href=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet ">
    <script src=" https://code.jquery.com/jquery-3.6.0.min.js "></script>
</head>
<body class="p-4 bg-light">
<div class="container">
    <h2 class="mb-4">ToDo List</h2>
    <div class="input-group mb-3">
        <input type="text" id="new-task" class="form-control" placeholder="Нове завдання">
        <button id="add-task" class="btn btn-primary">Додати</button>
    </div>
    <ul class="list-group" id="todo-list"></ul>
</div>
<div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="taskModalLabel">Завдання</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
            </div>
            <div class="modal-body" id="modalTaskText">Текст завдання</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрити</button>
            </div>
        </div>
    </div>
</div>
<script src=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js "></script>
<script src="dist/main.js"></script>
</body>
</html>
